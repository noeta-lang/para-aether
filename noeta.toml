[package]
name = "para/aether"
version = "0.4.0"
# The minimum noeta this package works with; enforced at resolve time from noeta 0.2.1 on. 0.5 is a
# floor rather than a preference: methods are private by default from that release on, so the `pub`
# markers this package now carries are a syntax error to anything older.
toolchain = ">=0.5"
license = "MIT OR Apache-2.0"
description = "The Noeta web framework: routing, middleware, dependency injection, sessions, and TLS."
keywords = ["web", "framework", "http", "server", "routing"]
