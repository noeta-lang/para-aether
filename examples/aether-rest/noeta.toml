[package]
name = "noeta/aether_rest"
version = "0.1.0"

[dependencies]
para = [{ path = "../.." }]

# `[directives]` binds every `@name` this package writes to the package that provides it — here
# `@test` to `std`. The target only says which of those names are live. Named `[tiers]` before
# noeta 0.5, where tier bindings and directive bindings were still two tables.
[directives]
test = "std"

[targets.development]
tiers = ["test"]
