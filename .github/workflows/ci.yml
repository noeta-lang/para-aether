name: CI

# The para/aether package's CI: the tree is canonically formatted, and every example program checks
# and tests, against a pinned released `noeta`. This package is pure Noeta, so there is no Rust job.
#
# Two jobs rather than two steps of one, so a red build says WHICH gate failed without opening the
# log — and they are independent, so a formatting slip does not hide a broken example.

on:
  push:
    branches: [main]
  pull_request:
  # Callable as the release gate (release.yml runs the full CI before publishing).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned in lockstep with the toolchain repo's own CI (dtolnay/rust-toolchain@1.97.0 there): the
# NOETA_VERSION resolves from the org-level Actions variable of the same name (single bump
# point for every para repo), falling back to the literal. Bumping is
# deliberate — raise it here and in `release.yml` together.
env:
  CARGO_TERM_COLOR: always
  NOETA_VERSION: ${{ vars.NOETA_VERSION || 'v0.1.0' }}

jobs:
  fmt:
    name: Format (noeta fmt --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install noeta ${{ env.NOETA_VERSION }}
        run: |
          DIST="noeta-${NOETA_VERSION}-x86_64-unknown-linux-gnu"
          curl -fsSL "https://github.com/noeta-lang/noeta/releases/download/${NOETA_VERSION}/${DIST}.tar.gz" | tar -xz
          echo "${PWD}/${DIST}" >> "$GITHUB_PATH"
      # The whole tree, by directory walk rather than a list of files: a new example or module is
      # gated the day it lands, with nobody having to remember to add it here. A block that is
      # deliberately hand-laid out (`content_type`'s extension table) says so with `// fmt: off`.
      - name: noeta fmt --check
        run: noeta fmt --check .

  examples:
    name: Examples (noeta check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install noeta ${{ env.NOETA_VERSION }}
        run: |
          DIST="noeta-${NOETA_VERSION}-x86_64-unknown-linux-gnu"
          curl -fsSL "https://github.com/noeta-lang/noeta/releases/download/${NOETA_VERSION}/${DIST}.tar.gz" | tar -xz
          echo "${PWD}/${DIST}" >> "$GITHUB_PATH"
      - name: noeta check + test every example
        run: |
          for ex in examples/*/; do
            echo "== ${ex}"
            for f in "${ex}"*.noe; do
              (cd "${ex}" && noeta check "$(basename "$f")" && noeta test "$(basename "$f")")
            done
          done
